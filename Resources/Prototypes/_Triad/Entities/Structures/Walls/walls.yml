- type: entity
  id: WallForceDyson
  name: force wall
  components:
  - type: TimedDespawn
    lifetime: 12
  - type: Tag
    tags:
    - Wall
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Airtight
  - type: Sprite
    sprite: Structures/Magic/forcewall.rsi
    state: forcewall
  - type: Icon
    sprite: Structures/Magic/forcewall.rsi
    state: forcewall

- type: entity
  id: WallForceDysonSpeaker
  name: force wall speaker
  components:
  - type: TimedDespawn
    lifetime: 12
  - type: AmbientSound
    volume: -1
    range: 30
    enabled: true
    sound:
      path: /Audio/_Triad/Magic/barrier.ogg
